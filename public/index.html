<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Interfaz de Aviónica - ARINC 429</title>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); margin-bottom: 20px; }
        h1, h2 { color: #4CAF50; border-bottom: 2px solid #333; padding-bottom: 5px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        select, input { width: 100%; padding: 10px; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 4px; box-sizing: border-box; }
        button { background: #4CAF50; color: white; border: none; padding: 10px 15px; cursor: pointer; border-radius: 4px; font-weight: bold; }
        button:hover { background: #45a049; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #444; padding: 10px; text-align: left; }
        th { background: #2d2d2d; }
        .btn-delete { background: #d32f2f; padding: 5px 10px; }
        .btn-delete:hover { background: #b71c1c; }
        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Gestión de Instrumentos (CRUD Parte A)</h1>
        <div class="row">
            <div class="form-group">
                <label for="nuevoNombre">Nombre:</label>
                <input type="text" id="nuevoNombre" placeholder="Ej: Altímetro">
            </div>
            <div class="form-group">
                <label for="nuevoLabel">Label (Octal):</label>
                <input type="text" id="nuevoLabel" placeholder="Ej: 203">
            </div>
        </div>
        <div class="row">
            <div class="form-group">
                <label for="nuevoMin">Mínimo:</label>
                <input type="number" id="nuevoMin" placeholder="Ej: -1000">
            </div>
            <div class="form-group">
                <label for="nuevoMax">Máximo:</label>
                <input type="number" id="nuevoMax" placeholder="Ej: 40000">
            </div>
        </div>
        <button id="guardar-instrumento" onclick="crearInstrumento()">Guardar Instrumento</button>
    </div>

    <div class="container">
        <h1>Panel de Control de Aviónica (ARINC 429)</h1>
        
        <div class="form-group">
            <label for="instrumento">Seleccionar Instrumento:</label>
            <select id="instrumento" disabled>
                <!-- Se llena dinámicamente desde la BD -->
            </select>
        </div>

        <div class="form-group">
            <label for="valor">Valor de Entrada:</label>
            <input type="number" id="valor" step="0.1" placeholder="Ej: 105.5">
        </div>

        <button id="enviar-dato" onclick="enviarDato()" disabled>Procesar y Guardar Envío</button>

        <h2>Registros de Envíos</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Instrumento</th>
                    <th>Valor</th>
                    <th>Trama ARINC (hex)</th>
                    <th>Tensión (V)</th>
                    <th>Máx / Mín</th>
                    <th>Fecha</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="tabla-cuerpo">
                <!-- Se llena dinámicamente -->
            </tbody>
        </table>
    </div>

    <script>
        // Cargar instrumentos en el combo desplegable
        async function cargarInstrumentos() {
            const select = document.getElementById('instrumento');
            const botonEnvio = document.getElementById('enviar-dato');
            try {
                const res = await fetch('/api/instrumentos');
                if (!res.ok) {
                    const resultado = await res.json();
                    throw new Error(resultado.error || 'No se pudieron cargar los instrumentos.');
                }
                const instrumentos = await res.json();
                select.innerHTML = '';

                if (instrumentos.length === 0) {
                    select.innerHTML = '<option value="">No hay instrumentos creados</option>';
                    select.disabled = true;
                    botonEnvio.disabled = true;
                    return;
                }

                instrumentos.forEach(inst => {
                    const option = document.createElement('option');
                    option.value = inst.nombre;
                    option.textContent = `${inst.nombre} (Label ${inst.label})`;
                    select.appendChild(option);
                });
                select.disabled = false;
                botonEnvio.disabled = false;
            } catch (error) {
                console.error("Error al cargar instrumentos:", error);
                select.innerHTML = '<option value="">Error al cargar instrumentos</option>';
                select.disabled = true;
                botonEnvio.disabled = true;
                alert('No se pudieron cargar los instrumentos: ' + error.message);
            }
        }

        // Crear un instrumento desde el formulario superior
        async function crearInstrumento() {
            const nombre = document.getElementById('nuevoNombre').value;
            const label = document.getElementById('nuevoLabel').value;
            const minimo = document.getElementById('nuevoMin').value;
            const maximo = document.getElementById('nuevoMax').value;

            if (!nombre.trim() || !label.trim() || minimo === '' || maximo === '') {
                alert('Por favor complete todos los campos del instrumento.');
                return;
            }
            if (!/^[0-7]{1,3}$/.test(label.trim()) || parseInt(label.trim(), 8) > 255) {
                alert('El label debe ser un número octal entre 0 y 377.');
                return;
            }
            if (!Number.isFinite(Number(minimo)) || !Number.isFinite(Number(maximo)) ||
                Number(minimo) >= Number(maximo)) {
                alert('El mínimo debe ser menor que el máximo.');
                return;
            }

            const boton = document.getElementById('guardar-instrumento');
            boton.disabled = true;
            try {
                const res = await fetch('/api/instrumentos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre: nombre.trim(), label: label.trim(), minimo, maximo })
                });

                const resultado = await res.json();
                if (!res.ok || !resultado.success) {
                    throw new Error(resultado.error || 'No se pudo guardar el instrumento.');
                }
                alert('¡Instrumento creado con éxito!');
                document.getElementById('nuevoNombre').value = '';
                document.getElementById('nuevoLabel').value = '';
                document.getElementById('nuevoMin').value = '';
                document.getElementById('nuevoMax').value = '';
                await cargarInstrumentos();
            } catch (error) {
                alert('Error al guardar el instrumento: ' + error.message);
            } finally {
                boton.disabled = false;
            }
        }

        async function cargarEnvios() {
            const res = await fetch('/api/envios');
            const datos = await res.json();
            const tbody = document.getElementById('tabla-cuerpo');
            tbody.innerHTML = '';
            
            datos.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.id}</td>
                    <td>${item.instrumento}</td>
                    <td>${item.valor}</td>
                    <td>${item.palabra_hex || '—'}</td>
                    <td>${item.tension ?? '—'}</td>
                    <td>${item.maximo} / ${item.minimo}</td>
                    <td>${new Date(item.fecha).toLocaleString()}</td>
                    <td><button class="btn-delete" onclick="eliminarEnvio(${item.id})">Eliminar</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function enviarDato() {
            const instrumento = document.getElementById('instrumento').value;
            const valor = document.getElementById('valor').value;

            if (!instrumento || valor === '') {
                alert('Por favor seleccione un instrumento e ingrese un valor.');
                return;
            }

            const boton = document.getElementById('enviar-dato');
            boton.disabled = true;
            try {
                const res = await fetch('/api/envios', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ instrumento, valor })
                });
                const resultado = await res.json();
                if (!res.ok || !resultado.success) {
                    throw new Error(resultado.error || 'No se pudo guardar el envío.');
                }
                alert(`Envío ${resultado.id} procesado y guardado.\nTrama ARINC: ${resultado.hex}\nTensión calculada: ${resultado.tension} V\nNo se transmitió a hardware.`);
                document.getElementById('valor').value = '';
                await cargarEnvios();
            } catch (error) {
                alert('Error al guardar el envío: ' + error.message);
            } finally {
                boton.disabled = false;
            }
        }

        async function eliminarEnvio(id) {
            if (confirm(`¿Estás seguro de eliminar el registro ID ${id}?`)) {
                await fetch(`/api/envios/${id}`, { method: 'DELETE' });
                cargarEnvios();
            }
        }

        // Inicializar datos al cargar la página
        window.onload = () => {
            cargarInstrumentos();
            cargarEnvios();
        };
    </script>
</body>
</html>
